<!DOCTYPE html>

  <style>
    /* 圖的寬度跟著畫面走，高度維持圖畫比例。 */
    * { box-sizing: border-box; }
    html { background: #f3eee4; }
    body {
      margin: 0;
      background: #f3eee4;
      color: #243038;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    .scene {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 4vh 4vw 6vh;
    }
    .scene svg {
      display: block;
      width: min(94vw, 1080px, calc(68vh * 3 / 2));
      height: auto;
    }
    .scene figcaption {
      margin: 0;
      max-width: 94vw;
      font-size: clamp(1.7rem, 3vw, 2.6rem);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }
    svg text {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-weight: 700;
    }
  </style>
</head>
